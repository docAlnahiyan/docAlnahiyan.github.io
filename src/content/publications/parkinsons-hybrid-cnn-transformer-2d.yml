abstract: >-
  This paper presents a novel hybrid architecture combining Convolutional Neural Networks
  (CNNs) with Transformer attention mechanisms for Parkinson's disease classification using
  2D structural MRI. The proposed model leverages the feature extraction capabilities of CNNs
  while incorporating the global context modeling of Transformers to achieve improved
  classification performance. Our lightweight model provides rapid pre-screening capabilities
  for early PD detection, achieving 80.51% accuracy on structural brain MRI data. The hybrid
  approach demonstrates the effectiveness of combining local feature extraction with global
  attention mechanisms for medical image analysis, offering a computationally efficient
  solution suitable for clinical deployment in resource-constrained settings.

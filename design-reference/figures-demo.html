<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Figures Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3efe6; --ink:#6e6a60; --border:#e2dacb; --accent:#c96442;
    --fig:#c96442; --detail:#8a5038; --paper:#f8f4ec; --book:#8f8575;
    --fd:"Newsreader",Georgia,serif; --fm:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  }
  :root[data-sky="night"]{
    --bg:#1a222e; --ink:#aab2bd; --border:#33404f; --accent:#e08a6a;
    --fig:#e79b7c; --detail:#c98a6a; --paper:#2a3340; --book:#b7b1a4;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fm);transition:background .35s}
  .bar{display:flex;align-items:center;gap:16px;padding:14px 22px;border-bottom:1px solid var(--border)}
  .bar h1{font-family:var(--fd);font-weight:600;font-size:16px;margin:0;color:var(--accent)}
  .spacer{flex:1 1 auto}
  button{font:inherit;font-size:12px;border:1px solid var(--border);background:transparent;color:var(--ink);border-radius:999px;padding:7px 13px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  svg{display:block;width:100%;height:auto}
  .caps{display:flex;justify-content:space-around;padding:6px 22px 16px;font-size:12px;color:var(--ink)}
  .caps span{flex:1;text-align:center}
</style>
</head>
<body>
<div class="bar">
  <h1>Hero figures — brain · dog · explorer</h1>
  <div class="spacer"></div>
  <button id="sky">☀︎ / ☾ day · night</button>
</div>
<svg id="stage" viewBox="0 0 900 340" preserveAspectRatio="xMidYMid meet" aria-label="Three redrawn hero sketches: a brain with folds and cerebellum, a walking dog, and a walking explorer with a hat and backpack"></svg>
<div class="caps"><span>Brain ⟲ Books (from the library, circling)</span><span>Dog (walk + tail wag)</span><span>Explorer (hat · pack · stick, walk cycle)</span></div>

<script src="rough.js"></script>
<script>
(function(){
  var root=document.documentElement, svg=document.getElementById('stage'), NS='http://www.w3.org/2000/svg';
  var rc=rough.svg(svg);
  function cv(n){return getComputedStyle(root).getPropertyValue(n).trim();}
  var FIG=function(){return cv('--fig')||'#c96442';};
  function E(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e;}
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var F='var(--fig)';

  // ground line
  E('line',{x1:330,y1:262,x2:570,y2:262,stroke:'var(--border)','stroke-width':2});
  E('line',{x1:640,y1:270,x2:860,y2:270,stroke:'var(--border)','stroke-width':2});

  /* ---------------- BRAIN ⟲ BOOKS (taken straight from the element library) ---------------- */
  var cBrain='var(--fig)', cBook='var(--book)';
  var ocx=152, ocy=158, oR=58;
  // dashed orbit ring + clockwise chevron (the ⟲)
  E('circle',{cx:ocx,cy:ocy,r:oR,fill:'none',stroke:cBrain,'stroke-width':1.3,'stroke-dasharray':'2 7','stroke-linecap':'round',opacity:.5});
  E('path',{d:'M'+(ocx+oR-6)+','+(ocy+2)+' L'+(ocx+oR)+','+(ocy+10)+' L'+(ocx+oR+6)+','+(ocy+2),fill:'none',stroke:cBrain,'stroke-width':1.3,'stroke-linecap':'round','stroke-linejoin':'round',opacity:.6});
  var orb=E('g',{});
  // mini brain at top of the ring
  var mb=E('g',{transform:'translate('+ocx+','+(ocy-oR)+') scale(0.66)'},orb);
  mb.appendChild(rc.path('M0,-16 q-16,-6 -24,6 q-14,2 -12,16 q-10,8 -2,18 q-2,14 14,14 q8,8 24,2 q16,6 24,-2 q16,0 14,-14 q8,-10 -2,-18 q2,-14 -12,-16 q-8,-12 -24,-6 Z',
    {stroke:cBrain,strokeWidth:2.8,roughness:1.5,fill:cBrain,fillStyle:'dots',fillWeight:2.4,hachureGap:9}));
  // mini open book + pencil at the bottom of the ring (matches the reference)
  var kb=E('g',{transform:'translate('+ocx+','+(ocy+oR)+') scale(0.6)'},orb);
  kb.appendChild(rc.path('M0,2 C-13,-6 -30,-8 -44,-5 L-44,15 C-30,14 -13,16 0,22 Z',{stroke:cBook,strokeWidth:2.6,roughness:1.3})); // left page
  kb.appendChild(rc.path('M0,2 C13,-6 30,-8 44,-5 L44,15 C30,14 13,16 0,22 Z',{stroke:cBook,strokeWidth:2.6,roughness:1.3}));    // right page
  E('line',{x1:0,y1:2,x2:0,y2:22,stroke:cBook,'stroke-width':2.6},kb);                                                         // spine
  kb.appendChild(rc.path('M-44,15 L-44,20 C-24,27 24,27 44,20 L44,15',{stroke:cBook,strokeWidth:2.3,fill:'none',roughness:1.2})); // cover thickness
  kb.appendChild(rc.path('M-38,18 C-18,23 18,23 38,18',{stroke:cBook,strokeWidth:1.2,fill:'none',roughness:1.4}));                // page stack
  kb.appendChild(rc.line(38,-7,15,11,{stroke:cBook,strokeWidth:3,roughness:0.8}));                                               // pencil body
  kb.appendChild(rc.path('M15,11 L10,17 L20,12 Z',{stroke:cBook,strokeWidth:1.2,fill:cBook,fillStyle:'solid',roughness:0.8}));   // graphite tip
  kb.appendChild(rc.line(38,-7,41.5,-10.5,{stroke:cBook,strokeWidth:3.4,roughness:0.8}));                                        // eraser end
  // the whole pair circles the ring (16s), as on the site
  if(!reduce){
    var at=document.createElementNS(NS,'animateTransform');
    at.setAttribute('attributeName','transform');at.setAttribute('type','rotate');
    at.setAttribute('from','0 '+ocx+' '+ocy);at.setAttribute('to','360 '+ocx+' '+ocy);
    at.setAttribute('dur','16s');at.setAttribute('repeatCount','indefinite');
    orb.appendChild(at);
  }
  svg.appendChild(orb);

  /* ---------------- DOG (faces right) ---------------- */
  var dog=E('g',{});
  var dbody=E('g',{},dog);
  dbody.appendChild(rc.ellipse(444,224,86,36,{stroke:F,strokeWidth:2.2,fill:F,fillStyle:'hachure',hachureGap:7,fillWeight:0.6,roughness:1.5})); // torso
  dbody.appendChild(rc.line(474,212,492,200,{stroke:F,strokeWidth:2.2,roughness:1.2})); // neck
  dbody.appendChild(rc.ellipse(506,198,32,26,{stroke:F,strokeWidth:2.1,fill:F,fillStyle:'hachure',hachureGap:6,fillWeight:0.6,roughness:1.4})); // head
  dbody.appendChild(rc.path('M 518 196 C 532 196, 536 202, 532 208 C 526 210, 518 208, 516 204 Z',{stroke:F,strokeWidth:1.8,fill:F,fillStyle:'solid',roughness:1.2})); // snout
  dbody.appendChild(rc.path('M 494 188 L 489 172 L 502 184 Z',{stroke:F,strokeWidth:1.6,fill:F,fillStyle:'hachure',hachureGap:3,roughness:1.2})); // ear back
  dbody.appendChild(rc.path('M 508 186 L 510 170 L 519 184 Z',{stroke:F,strokeWidth:1.6,fill:F,fillStyle:'hachure',hachureGap:3,roughness:1.2})); // ear front
  E('circle',{cx:510,cy:195,r:1.8,fill:F},dbody); // eye
  E('circle',{cx:531,cy:202,r:2.2,fill:F},dbody); // nose
  // tail (wags)
  var tail=E('g',{},dog);
  tail.appendChild(rc.path('M 0 0 C -10 -2, -18 -12, -16 -26',{stroke:F,strokeWidth:2.4,roughness:1.3}));
  var tailBase={x:403,y:214};
  // legs
  function limb(parent,jx,jy,len,w){
    var g=E('g',{},parent); g.appendChild(rc.line(0,0,len,0,{stroke:F,strokeWidth:w,roughness:1.1}));
    return {set:function(d){g.setAttribute('transform','translate('+jx+' '+jy+') rotate('+d+')');}};
  }
  var dFN=limb(dog,470,238,22,3.2), dFF=limb(dog,460,238,22,2.4),
      dBN=limb(dog,420,238,22,3.2), dBF=limb(dog,430,238,22,2.4);
  svg.appendChild(dog);

  /* ---------------- EXPLORER (faces right) ---------------- */
  var exp=E('g',{});
  var hipX=752,hipY=232, shX=752,shY=200, headY=184;
  var body=E('g',{},exp); // head, hat, torso, pack (bob together)
  body.appendChild(rc.rectangle(735,206,15,22,{stroke:F,strokeWidth:1.8,fill:F,fillStyle:'hachure',hachureGap:5,fillWeight:0.6,roughness:1.3})); // backpack
  body.appendChild(rc.line(shX,shY,hipX,hipY,{stroke:F,strokeWidth:3.4,roughness:1.1})); // torso
  body.appendChild(rc.circle(752,headY,22,{stroke:F,strokeWidth:2.2,fill:F,fillStyle:'solid',roughness:1.1})); // head
  body.appendChild(rc.path('M 738 178 C 748 170, 758 170, 768 178',{stroke:F,strokeWidth:2,roughness:1.1})); // hat cap
  body.appendChild(rc.line(733,179,773,179,{stroke:F,strokeWidth:2.2,roughness:1})); // hat brim
  // arms + legs
  var armB=limb(exp,shX,shY+4,22,2.8);   // back arm swings
  var armF=limb(exp,shX,shY+4,22,2.8);   // front arm holds stick
  var legA=limb(exp,hipX,hipY,30,3.4);
  var legB=limb(exp,hipX,hipY,30,3.4);
  var stick=E('line',{x1:0,y1:0,x2:0,y2:0,stroke:F,'stroke-width':2,'stroke-linecap':'round'},exp);
  svg.appendChild(exp);

  /* ---------------- theme ---------------- */
  var night=false;
  document.getElementById('sky').addEventListener('click',function(){
    night=!night; root.setAttribute('data-sky',night?'night':'day');
  });
  // NOTE: rough.js baked the fig colour into nodes; re-render on theme flip for true recolour.
  // For the demo, stroke uses the live var() string so it recolours automatically.

  /* ---------------- animate ---------------- */
  var last=performance.now();
  function frame(now){
    var t=now/1000;

    // dog walk
    var dp=t*3.4, dsw=16;
    dFN.set(90 + dsw*Math.sin(dp));        dBF.set(90 + dsw*Math.sin(dp));
    dFF.set(90 + dsw*Math.sin(dp+Math.PI)); dBN.set(90 + dsw*Math.sin(dp+Math.PI));
    var dbob=1.6*Math.sin(dp*2);
    dbody.setAttribute('transform','translate(0 '+dbob.toFixed(2)+')');
    tail.setAttribute('transform','translate('+tailBase.x+' '+(tailBase.y+dbob)+') rotate('+(18*Math.sin(t*7)).toFixed(1)+')');

    // explorer walk
    var ep=t*3.0, esw=22;
    legA.set(90 + esw*Math.sin(ep));
    legB.set(90 + esw*Math.sin(ep+Math.PI));
    armB.set(90 - 18*Math.sin(ep));            // opposite to front leg
    var fa=90 + 26 + 10*Math.sin(ep+Math.PI);  // front arm angled forward holding stick
    armF.set(fa);
    var ebob=1.6*Math.sin(ep*2);
    body.setAttribute('transform','translate(0 '+ebob.toFixed(2)+')');
    // stick: from front hand to ground ahead
    var r=fa*Math.PI/180, hx=shX+22*Math.cos(r), hy=shY+4+22*Math.sin(r)+ebob;
    stick.setAttribute('x1',hx.toFixed(1)); stick.setAttribute('y1',hy.toFixed(1));
    stick.setAttribute('x2',(hx+10).toFixed(1)); stick.setAttribute('y2',270);

    requestAnimationFrame(frame);
  }
  function staticPose(){
    dFN.set(104);dBF.set(104);dFF.set(76);dBN.set(76);
    tail.setAttribute('transform','translate('+tailBase.x+' '+tailBase.y+') rotate(14)');
    legA.set(112);legB.set(70);armB.set(74);armF.set(116);
    var r=116*Math.PI/180,hx=shX+22*Math.cos(r),hy=shY+4+22*Math.sin(r);
    stick.setAttribute('x1',hx.toFixed(1));stick.setAttribute('y1',hy.toFixed(1));
    stick.setAttribute('x2',(hx+10).toFixed(1));stick.setAttribute('y2',270);
  }
  if(reduce) staticPose(); else requestAnimationFrame(frame);
})();
</script>
</body>
</html>

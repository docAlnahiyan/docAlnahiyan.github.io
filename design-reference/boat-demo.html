<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boat Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3efe6; --ink:#2f2a22; --ink-2:#6e6a60; --border:#e2dacb; --accent:#c96442;
    --sky0:#f3efe6; --sky1:#e9eef1; --water-top:#cfe3ec; --water-bot:#bcd7e4; --sketch:#39322a; --lamp:#ffcf8a;
    --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; --font-d:"Newsreader",Georgia,serif;
  }
  :root[data-sky="night"]{
    --bg:#1a222e; --ink:#e8e3d8; --ink-2:#aab2bd; --border:#33404f; --accent:#e08a6a;
    --sky0:#1a222e; --sky1:#243247; --water-top:#223044; --water-bot:#19222f; --sketch:#dcd6c9; --lamp:#ffd48c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-mono);transition:background .35s}
  .bar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:14px 22px;border-bottom:1px solid var(--border)}
  .bar h1{font-family:var(--font-d);font-weight:600;font-size:16px;margin:0;color:var(--ink)}
  .spacer{flex:1 1 auto}
  label.sp{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--ink-2)}
  input[type=range]{width:180px}
  button{font:inherit;font-size:12px;border:1px solid var(--border);background:transparent;color:var(--ink);border-radius:999px;padding:7px 13px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  .stage{display:block;width:100%}
  svg{display:block;width:100%;height:auto;background:transparent}
  .hint{padding:10px 22px;font-size:12px;color:var(--ink-2);border-top:1px solid var(--border)}
</style>
</head>
<body>
<div class="bar">
  <h1>River boat — rowing & lantern</h1>
  <div class="spacer"></div>
  <label class="sp">speed <input id="speed" type="range" min="0" max="100" value="45"></label>
  <span id="splbl" style="font-size:11px;color:var(--ink-2);width:54px">cruise</span>
  <button id="sky">☀︎ / ☾ day · night</button>
</div>

<svg id="stage" viewBox="0 0 820 440" preserveAspectRatio="xMidYMid meet" aria-label="A hand-sketched boat on a river; the rower pulls the oar and a lantern lights at night, reflecting on the water"></svg>
<div class="hint">The oar stroke, water flow and wake all speed up with the boat. Switch to night: the lantern lights and shimmers a reflection on the river.</div>

<script src="rough.js"></script>
<script>
(function(){
  var root=document.documentElement;
  var svg=document.getElementById('stage');
  var NS='http://www.w3.org/2000/svg';
  var rc=rough.svg(svg);
  var SK=function(){return getComputedStyle(root).getPropertyValue('--sketch').trim()||'#39322a';};

  var W=820,H=440, waterY=270;
  function E(n,a,parent){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);(parent||svg).appendChild(e);return e;}

  // ---------- defs: gradients + glow ----------
  var defs=E('defs',{});
  defs.innerHTML=
    '<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0" stop-color="var(--sky0)"/><stop offset="1" stop-color="var(--sky1)"/></linearGradient>'+
    '<linearGradient id="water" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0" stop-color="var(--water-top)"/><stop offset="1" stop-color="var(--water-bot)"/></linearGradient>'+
    '<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">'+
      '<stop offset="0" stop-color="var(--lamp)" stop-opacity="0.95"/>'+
      '<stop offset="0.4" stop-color="var(--lamp)" stop-opacity="0.45"/>'+
      '<stop offset="1" stop-color="var(--lamp)" stop-opacity="0"/></radialGradient>'+
    '<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>';

  // ---------- backdrop ----------
  E('rect',{x:0,y:0,width:W,height:waterY,fill:'url(#sky)'});
  E('rect',{x:0,y:waterY,width:W,height:H-waterY,fill:'url(#water)'});
  // moon/sun
  var orb=E('circle',{cx:118,cy:80,r:26,fill:'none',stroke:'var(--sketch)','stroke-width':2,'stroke-dasharray':'2 7','stroke-linecap':'round',opacity:.7});

  // flowing water lines (plain, drift)
  var flow=E('g',{});
  var flowLines=[];
  for(var i=0;i<5;i++){
    var y=waterY+24+i*28;
    var ln=E('path',{d:'',fill:'none',stroke:'var(--sketch)','stroke-width':1.4,'stroke-linecap':'round','stroke-dasharray':'3 16',opacity:(0.32-i*0.03).toFixed(2)},flow);
    flowLines.push({el:ln,y:y,off:Math.random()*40,amp:3+i});
  }

  // ---------- reflection (night) ----------
  var reflG=E('g',{filter:'url(#soft)',opacity:0});
  var reflDashes=[];
  for(var i=0;i<9;i++){
    var d=E('line',{x1:0,y1:0,x2:0,y2:0,stroke:'var(--lamp)','stroke-width':(3.4-i*0.25).toFixed(1),'stroke-linecap':'round',opacity:(0.5-i*0.045).toFixed(2)},reflG);
    reflDashes.push(d);
  }

  // ---------- BOAT group (rocks as a whole) ----------
  var boat=E('g',{});
  // hull (rough)
  var hull=rc.path('M 300 268 C 330 300, 500 300, 540 268 L 520 262 C 470 276, 360 276, 318 262 Z',
    {stroke:SK(),strokeWidth:2.4,fill:SK(),fillStyle:'hachure',fillWeight:1,hachureGap:6,roughness:1.6});
  boat.appendChild(hull);
  // gunwale line
  boat.appendChild(rc.line(316,263,522,263,{stroke:SK(),strokeWidth:2,roughness:1.4}));

  // lamp pole at bow (right) + lantern
  var lamp=E('g',{},boat);
  lamp.appendChild(rc.line(508,262,508,214,{stroke:SK(),strokeWidth:2.2,roughness:1.2}));
  lamp.appendChild(rc.line(508,216,528,216,{stroke:SK(),strokeWidth:2,roughness:1.2}));
  lamp.appendChild(rc.rectangle(521,219,15,18,{stroke:SK(),strokeWidth:1.8,fill:SK(),fillStyle:'hachure',hachureGap:4,fillWeight:0.8,roughness:1.1}));
  var Lx=528.5, Ly=228; // lantern centre
  var glow=E('circle',{cx:Lx,cy:Ly,r:46,fill:'url(#glow)',opacity:0});   // night glow
  boat.appendChild(glow);
  var flame=E('circle',{cx:Lx,cy:Ly,r:3.4,fill:'var(--lamp)',opacity:0},boat);

  // rower: torso (rotates), head, (arms drawn dynamically)
  var hip={x:452,y:258};
  var sh ={x:446,y:232};
  var torso=E('g',{},boat);
  torso.appendChild(rc.line(hip.x,hip.y,sh.x,sh.y,{stroke:SK(),strokeWidth:4,roughness:1.3}));
  torso.appendChild(rc.circle(sh.x-4,sh.y-14,20,{stroke:SK(),strokeWidth:2.2,fill:SK(),fillStyle:'solid',roughness:1.2})); // head
  // leg hint
  boat.appendChild(rc.line(hip.x,hip.y,410,262,{stroke:SK(),strokeWidth:3,roughness:1.3}));
  // arm (dynamic)
  var arm=E('path',{d:'',fill:'none',stroke:SK(),'stroke-width':3,'stroke-linecap':'round'},boat);

  // OAR group (rotates about pivot P)
  var P={x:430,y:258}, Lo=132, Li=58;
  var oar=E('g',{},boat);
  oar.appendChild(rc.line(-Li,0,Lo-16,0,{stroke:SK(),strokeWidth:3,roughness:1.0}));     // shaft, local +x toward blade
  oar.appendChild(rc.path('M '+(Lo-18)+' -7 L '+Lo+' -3 L '+Lo+' 7 L '+(Lo-18)+' 9 Z',
    {stroke:SK(),strokeWidth:2,fill:SK(),fillStyle:'hachure',hachureGap:4,fillWeight:0.8,roughness:1.1})); // blade

  // splash at the catch (dynamic)
  var splash=E('path',{d:'',fill:'none',stroke:'var(--sketch)','stroke-width':1.6,'stroke-linecap':'round',opacity:0},boat);
  // wake behind boat
  var wake=E('path',{d:'',fill:'none',stroke:'var(--sketch)','stroke-width':1.6,'stroke-linecap':'round',opacity:.5},svg);

  // ---------- state ----------
  var speedEl=document.getElementById('speed'), spl=document.getElementById('splbl');
  function speedLabel(v){return v<12?'drifting':v<40?'easy':v<70?'cruise':v<90?'quick':'racing';}
  speedEl.addEventListener('input',function(){spl.textContent=speedLabel(+speedEl.value);});
  spl.textContent=speedLabel(+speedEl.value);

  var night=false;
  document.getElementById('sky').addEventListener('click',function(){
    night=!night; root.setAttribute('data-sky',night?'night':'day');
    orb.setAttribute('stroke-dasharray', night?'1 0':'2 7'); // moon solid-ish ring vs dashed sun
  });

  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var DEG=180/Math.PI;

  var phase=0, boatX=0, last=performance.now();
  function frame(now){
    var dt=Math.min(50, now-last)/1000; last=now;
    var v=+speedEl.value/100;                 // 0..1
    var hz=0.18 + v*0.95;                      // strokes per second
    if(!reduce) phase=(phase + dt*hz)%1;
    var p=phase;

    // oar angle: catch(forward-low) -> finish(back-higher), lift during recovery
    var sweep=Math.cos(2*Math.PI*p);           // +1 catch .. -1 finish
    var lift = p>0.5 ? Math.sin(Math.PI*(p-0.5)/0.5) : 0;   // 0..1 during recovery
    var phi = 138 - 22*sweep + 16*lift;        // degrees, direction to blade
    oar.setAttribute('transform','translate('+P.x+','+P.y+') rotate('+phi.toFixed(2)+')');

    var r=phi/DEG;
    var blade={x:P.x+Lo*Math.cos(r), y:P.y+Lo*Math.sin(r)};
    var hand ={x:P.x-Li*Math.cos(r), y:P.y-Li*Math.sin(r)};

    // arm: shoulder -> hand, slight elbow bend
    var mx=(sh.x+hand.x)/2 + 4, my=(sh.y+hand.y)/2 + 6;
    arm.setAttribute('d','M '+sh.x+' '+sh.y+' Q '+mx+' '+my+' '+hand.x.toFixed(1)+' '+hand.y.toFixed(1));

    // torso lean: back on drive (p .0-.5), forward on recovery
    var lean = 10*Math.cos(2*Math.PI*p);       // deg
    torso.setAttribute('transform','rotate('+(-lean).toFixed(2)+' '+hip.x+' '+hip.y+')');

    // whole-boat rock + bob (slower), amplitude grows a touch with speed
    var rock = (1.1+0.9*v)*Math.sin(now/900);
    var bob  = 2.2*Math.sin(now/1100);
    boat.setAttribute('transform','translate(0 '+bob.toFixed(2)+') rotate('+rock.toFixed(2)+' 420 '+waterY+')');

    // splash when blade is in water near the catch/drive
    var inWater = p<0.52 && blade.y>waterY-6;
    if(inWater && !reduce){
      var sx=blade.x, sy=Math.max(blade.y, waterY+2), s=4+6*v;
      splash.setAttribute('opacity', (0.55*(1-p/0.52)).toFixed(2));
      splash.setAttribute('d','M '+(sx-s)+' '+sy+' q '+s+' -'+(s*1.3)+' '+(2*s)+' 0 M '+(sx-2)+' '+(sy-2)+' l 3 -'+(5+4*v));
    } else { splash.setAttribute('opacity',0); }

    // wake behind the boat (left side), wiggle scales with speed
    var wph=now/260;
    var wd='M 150 '+(waterY+10)+' ';
    for(var x=0;x<=150;x+=15){ var yy=waterY+10+Math.sin((x/18)+wph)*(1.5+3.5*v); wd+='L '+(150-x)+' '+yy.toFixed(1)+' '; }
    wake.setAttribute('d',wd); wake.setAttribute('opacity',(0.18+0.4*v).toFixed(2));

    // flowing water lines drift leftwards with speed
    flowLines.forEach(function(f){
      f.off=(f.off + dt*(20+120*v))% 60;
      var d='M '+(-60+f.off)+' '+f.y+' ';
      for(var x=-60;x<=W+60;x+=30){ d+='L '+(x+f.off)+' '+(f.y+Math.sin((x/40)+now/1400)*f.amp).toFixed(1)+' '; }
      f.el.setAttribute('d',d);
    });

    // lantern glow + reflection (night only)
    var tgt = night?1:0;
    var flick = night? (0.82 + 0.18*Math.sin(now/90)+0.06*Math.sin(now/37)) : 0;
    glow.setAttribute('opacity', (tgt*flick).toFixed(3));
    glow.setAttribute('r', (44+3*Math.sin(now/120)).toFixed(1));
    flame.setAttribute('opacity', (tgt*flick).toFixed(3));
    reflG.setAttribute('opacity', tgt.toFixed(2));
    if(night){
      for(var i=0;i<reflDashes.length;i++){
        var yy=waterY+6+i*13;
        var wob=Math.sin(now/300 + i*0.7)*(2+i*0.8) + Math.sin(now/120+i)*1.2;
        var halfw=(10- i*0.7)*(0.7+0.5*flick);
        var cx=Lx+wob;
        reflDashes[i].setAttribute('x1',(cx-halfw).toFixed(1));
        reflDashes[i].setAttribute('x2',(cx+halfw).toFixed(1));
        reflDashes[i].setAttribute('y1',yy); reflDashes[i].setAttribute('y2',yy);
      }
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

# Admin (Sveltia CMS) configuration: the forms at /admin.
# Every save is a commit to main; a GitHub Action rebuilds and publishes the
# site. Field names here must match src/content.config.ts.

backend:
  name: github
  repo: docAlnahiyan/docAlnahiyan.github.io
  branch: main
  # "Login with GitHub" goes through our own sign-in service (oauth-proxy/,
  # deployed as the Netlify site alnahiyan-admin), which posts the token only
  # to https://docalnahiyan.github.io. Netlify's shared broker never handed it
  # back to this GitHub Pages origin.
  base_url: https://alnahiyan-admin.netlify.app
  auth_endpoint: auth
  site_domain: alnahiyan-admin.netlify.app
  # The repo is public, so the login token needs access to public repos only.
  auth_scope: public_repo
  commit_messages:
    create: "Admin: add {{collection}} “{{slug}}”"
    update: "Admin: update {{collection}} “{{slug}}”"
    delete: "Admin: delete {{collection}} “{{slug}}”"
    uploadMedia: "Admin: upload {{path}}"
    deleteMedia: "Admin: delete {{path}}"

# Local testing: run `npm run dev`, open http://localhost:4321/admin/ and
# choose "Work with Local Repository" (Chrome or Edge).

media_folder: public/uploads
public_folder: /uploads

app_title: Al-Nahiyan · Admin
logo:
  src: /favicon.svg
site_url: https://docalnahiyan.github.io
display_url: https://docalnahiyan.github.io

slug:
  encoding: ascii
  clean_accents: true

collections:
  # ------------------------------------------------------------------ research
  - name: research
    icon: science
    label: Research
    label_singular: Research entry
    description: Your research. Each entry has a summary on the Research page and its own full page.
    folder: src/content/research
    extension: md
    format: frontmatter
    create: true
    slug: "{{fields.slug}}"
    identifier_field: title
    summary: "{{title}}"
    sortable_fields: [order, title]
    fields:
      - { name: title, label: Title, widget: string }
      - name: slug
        label: Web address
        widget: string
        hint: "Lowercase letters, numbers and hyphens, e.g. hybridtransmedformer. Becomes /research/your-web-address/. Don't change it after publishing, or old links break."
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "Use lowercase letters, numbers and hyphens only"]
      - { name: subtitle, label: One-line subtitle, widget: string, hint: "Shown under the title on the Research page." }
      - { name: short_summary, label: Short summary, widget: text, hint: "One paragraph, shown when the entry is expanded." }
      - { name: tags, label: Tags, widget: list, required: false, hint: "Comma-separated, e.g. 3D MRI, Thesis" }
      - name: status
        label: Status
        widget: select
        options:
          - { label: Published (peer-reviewed), value: published }
          - { label: Under review, value: under-review }
          - { label: Preprint, value: preprint }
          - { label: In progress, value: in-progress }
        hint: "Must match the linked publication's status, or the site won't rebuild."
      - name: publication
        label: Linked publication
        widget: relation
        collection: publications
        search_fields: [title]
        value_field: "{{slug}}"
        display_fields: [title]
        required: false
        hint: "The paper this research produced. Its authors, venue, DOI and BibTeX are shown from there."
      - { name: thumbnail, label: Thumbnail image, widget: image, required: false }
      - name: metrics
        label: Key results
        widget: list
        required: false
        summary: "{{fields.value}} {{fields.label}}"
        fields:
          - { name: value, label: Value, widget: string, hint: "e.g. 92.34%" }
          - { name: label, label: Label, widget: string, hint: "e.g. accuracy" }
      - name: links
        label: Extra links
        widget: object
        required: false
        collapsed: true
        hint: "Only for links not already on the linked publication."
        fields:
          - { name: doi, label: DOI link, widget: string, required: false }
          - { name: code, label: Code link, widget: string, required: false }
          - { name: pdf, label: PDF link, widget: string, required: false }
      - { name: featured, label: Featured, widget: boolean, default: false, required: false }
      - name: walkthrough
        label: Walkthrough key
        widget: string
        required: false
        hint: "Leave empty unless a walkthrough has been built for this entry."
      - { name: order, label: Sort order, widget: number, value_type: int, default: 100, hint: "Lower numbers appear first." }
      - { name: body, label: Full page text, widget: markdown, hint: "The first paragraph is shown as the page's abstract." }

  # ------------------------------------------------------------------ projects
  - name: projects
    icon: deployed_code
    label: Projects
    label_singular: Project
    folder: src/content/projects
    extension: md
    format: frontmatter
    create: true
    slug: "{{fields.slug}}"
    identifier_field: title
    summary: "{{title}}"
    sortable_fields: [order, date, title]
    fields:
      - { name: title, label: Title, widget: string }
      - name: slug
        label: Web address
        widget: string
        hint: "Lowercase letters, numbers and hyphens. Becomes /projects/your-web-address/."
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "Use lowercase letters, numbers and hyphens only"]
      - { name: one_liner, label: One-line description, widget: string }
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: repo_url, label: GitHub repository, widget: string, required: false, hint: "Full URL. Leave empty if there's no public repo." }
      - name: icon
        label: Icon
        widget: select
        default: code
        hint: "Shown beside the project in the list. A thumbnail image, if set, is used instead."
        options:
          - { label: "Code", value: code }
          - { label: "Face and sound (multimodal)", value: face-sound }
          - { label: "Face scan (emotion / face recognition)", value: face-scan }
          - { label: "Bird", value: bird }
          - { label: "Face mask", value: mask }
          - { label: "Shopping cart (recommendation)", value: cart }
          - { label: "Bone (X-ray)", value: bone }
          - { label: "Brain", value: brain }
          - { label: "Scan slices (3D imaging)", value: slices }
          - { label: "Eye (vision)", value: eye }
          - { label: "Image", value: image }
          - { label: "Chart (data analysis)", value: chart }
          - { label: "Neural network", value: network }
          - { label: "Microscope (medical)", value: microscope }
          - { label: "Database", value: database }
          - { label: "Text (language)", value: text }
          - { label: "Robot (AI agent)", value: robot }
          - { label: "Shield (security / fraud)", value: shield }
      - { name: thumbnail, label: Thumbnail image, widget: image, required: false }
      - name: metrics
        label: Key results
        widget: list
        required: false
        summary: "{{fields.value}} {{fields.label}}"
        fields:
          - { name: value, label: Value, widget: string }
          - { name: label, label: Label, widget: string }
      - { name: date, label: Completed, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - { name: order, label: Sort order, widget: number, value_type: int, default: 100, hint: "Lower numbers appear first." }
      - { name: body, label: Description, widget: markdown, hint: "The first paragraph is shown when the project is expanded." }

  # -------------------------------------------------------------- publications
  - name: publications
    icon: menu_book
    label: Publications
    label_singular: Publication
    description: The only place papers are listed. Be exact about status.
    folder: src/content/publications
    extension: yml
    format: yml
    create: true
    slug: "{{fields.slug}}"
    identifier_field: title
    summary: "{{year}} · {{title}}"
    sortable_fields: [year, title]
    editor: { preview: false }
    fields:
      - { name: title, label: Title, widget: string }
      - name: slug
        label: Short id
        widget: string
        hint: "Lowercase letters, numbers and hyphens, e.g. hybridtransmedformer. Used to link research entries to this paper."
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "Use lowercase letters, numbers and hyphens only"]
      - { name: authors, label: Authors, widget: string, hint: "IEEE style, e.g. A.-N. Khushbu, Z. Yang, and X. Zhang. Your name is bolded automatically." }
      - { name: venue, label: Venue, widget: string, hint: "Full conference or journal name, or 'Preprint'." }
      - { name: venue_short, label: Short venue, widget: string, required: false, hint: "e.g. IARCE 2024" }
      - name: type
        label: Type
        widget: select
        options:
          - { label: Conference paper, value: conference }
          - { label: Journal article, value: journal }
          - { label: Preprint, value: preprint }
          - { label: Thesis, value: thesis }
      - { name: year, label: Year, widget: number, value_type: int, hint: "Year published, submitted (under review) or posted (preprint)." }
      - { name: date, label: Exact date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true, required: false }
      - name: status
        label: Status
        widget: select
        options:
          - { label: Published (peer-reviewed), value: published }
          - { label: Under review, value: under-review }
          - { label: Preprint (not peer-reviewed), value: preprint }
          - { label: In progress, value: in-progress }
      - { name: pages, label: Pages, widget: string, required: false, hint: "e.g. pp. 307–311" }
      - { name: award, label: Award, widget: string, required: false }
      - { name: keywords, label: Keywords, widget: list, required: false }
      - { name: abstract, label: Abstract, widget: text, required: false, hint: "Separate paragraphs with a blank line." }
      - { name: doi, label: DOI, widget: string, required: false, hint: "Just the DOI, e.g. 10.1109/IARCE64300.2024.00064" }
      - { name: url, label: Paper link, widget: string, required: false, hint: "Open link to the paper (e.g. a preprint page). Hides 'Request full paper'." }
      - { name: code_url, label: Code link, widget: string, required: false }
      - { name: contact_email, label: Contact email for this paper, widget: string, required: false, hint: "Shown only on this entry." }
      - { name: bibtex, label: BibTeX, widget: text }

  # ---------------------------------------------------------------------- blog
  - name: blog
    icon: edit_note
    label: Blog
    label_singular: Post
    folder: src/content/blog
    # MDX, so posts can place figures in the text (the "Figure" button in the
    # editor inserts one). Plain Markdown is valid MDX.
    extension: mdx
    format: frontmatter
    create: true
    slug: "{{fields.slug}}"
    identifier_field: title
    summary: "{{date}} · {{title}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string }
      - name: slug
        label: Web address
        widget: string
        hint: "Lowercase letters, numbers and hyphens. Becomes /blog/your-web-address/."
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "Use lowercase letters, numbers and hyphens only"]
      - { name: date, label: Date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - { name: excerpt, label: Excerpt, widget: text, hint: "One or two sentences for the blog list and link previews." }
      - { name: cover, label: Cover image, widget: image, required: false }
      - { name: cover_alt, label: Cover description (alt text), widget: string, required: false, hint: "What the cover shows, for screen readers. If empty, the post title is used." }
      - { name: draft, label: Draft (hidden from the site), widget: boolean, default: false, required: false }
      - name: gallery
        label: Image gallery
        widget: list
        required: false
        hint: "Optional images shown as a gallery after the post; visitors can open each one large. To put a single image inside the text, use the Figure button in the editor."
        summary: "{{fields.alt}}"
        fields:
          - { name: src, label: Image, widget: image }
          - { name: alt, label: Description (alt text), widget: string, hint: "What the image shows, for screen readers." }
          - { name: caption, label: Caption, widget: string, required: false }
      - { name: body, label: Post, widget: markdown, hint: "Use the Figure button (+ menu) to place an image beside or within the text." }

  # -------------------------------------------------------------------- upwork
  - name: upwork
    icon: work
    label: Upwork work
    label_singular: Upwork item
    description: Kind of work only; no client names or confidential details.
    folder: src/content/upwork
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}}"
    editor: { preview: false }
    fields:
      - { name: title, label: Title, widget: string }
      - { name: summary, label: Summary, widget: text }
      - { name: skills, label: Skills, widget: list, required: false }
      - { name: year, label: Year, widget: number, value_type: int, required: false }
      - { name: order, label: Sort order, widget: number, value_type: int, default: 100 }
      - { name: draft, label: Draft (hidden from the site), widget: boolean, default: false, required: false }

  # ---------------------------------------------------------------- appearance
  - name: appearance
    icon: palette
    label: Appearance
    description: Colours, fonts and style for the whole site. Changes go live about two minutes after you save. The preview on the right shows day and night as you edit.
    files:
      - name: theme
        label: Colours, fonts and style
        file: src/content/site/theme.yml
        fields:
          - name: use_default
            label: Use the built-in design
            widget: boolean
            default: false
            hint: "Turn on to ignore everything below and go back to the original design. Your values stay saved, so you can turn it off again."
          - name: light
            label: Day colours
            widget: object
            collapsed: true
            summary: "Background {{fields.bg}} · Cards {{fields.surface}} · Links {{fields.accent_ink}}"
            hint: "Light mode."
            fields:
              - { name: bg, label: "Page background", widget: color, allowInput: true }
              - { name: surface, label: "Cards", widget: color, allowInput: true, hint: "Fill of cards, the contact form and panels." }
              - { name: surface_2, label: "Inner boxes", widget: color, allowInput: true, hint: "Boxes inside cards, chart areas." }
              - { name: border, label: "Borders", widget: color, allowInput: true }
              - { name: ink, label: "Main text", widget: color, allowInput: true }
              - { name: ink_2, label: "Secondary text", widget: color, allowInput: true, hint: "Descriptions, captions, notes." }
              - { name: accent, label: "Accent (marks and hover)", widget: color, allowInput: true, hint: "Hover borders, timeline dots, small marks." }
              - { name: accent_ink, label: "Links and buttons", widget: color, allowInput: true, hint: "Links, button fills and accent text." }
              - { name: accent_wash, label: "Tag and highlight background", widget: color, allowInput: true, hint: "Soft fill behind tags and the active menu item." }
          - name: dark
            label: Night colours
            widget: object
            collapsed: true
            summary: "Background {{fields.bg}} · Cards {{fields.surface}} · Links {{fields.accent_ink}}"
            hint: "Dark mode."
            fields:
              - { name: bg, label: "Page background", widget: color, allowInput: true }
              - { name: surface, label: "Cards", widget: color, allowInput: true, hint: "Fill of cards, the contact form and panels." }
              - { name: surface_2, label: "Inner boxes", widget: color, allowInput: true, hint: "Boxes inside cards, chart areas." }
              - { name: border, label: "Borders", widget: color, allowInput: true }
              - { name: ink, label: "Main text", widget: color, allowInput: true }
              - { name: ink_2, label: "Secondary text", widget: color, allowInput: true, hint: "Descriptions, captions, notes." }
              - { name: accent, label: "Accent (marks and hover)", widget: color, allowInput: true, hint: "Hover borders, timeline dots, small marks." }
              - { name: accent_ink, label: "Links and buttons", widget: color, allowInput: true, hint: "Links, button fills and accent text." }
              - { name: accent_wash, label: "Tag and highlight background", widget: color, allowInput: true, hint: "Soft fill behind tags and the active menu item." }
          - name: hero
            label: Hero sky
            widget: object
            collapsed: true
            summary: "Day {{fields.day_top}} → {{fields.day_horizon}} · Night {{fields.night_top}} → {{fields.night_bottom}}"
            hint: "The sky behind your name on the home page."
            fields:
              - { name: day_top, label: "Day: top of the sky", widget: color, allowInput: true }
              - { name: day_middle, label: "Day: middle", widget: color, allowInput: true }
              - { name: day_horizon, label: "Day: horizon", widget: color, allowInput: true }
              - { name: night_top, label: "Night: top of the sky", widget: color, allowInput: true }
              - { name: night_bottom, label: "Night: horizon", widget: color, allowInput: true }
          - name: fonts
            label: Fonts
            widget: object
            collapsed: true
            summary: "Headings {{fields.heading}} · Name {{fields.hero_name}} · Body {{fields.body}} · Labels {{fields.labels}}"
            fields:
              - name: heading
                label: Headings
                widget: select
                hint: "Page and section titles, card titles, big numbers."
                options:
                  - { label: "Inter (modern sans)", value: inter }
                  - { label: "IBM Plex Sans (technical sans)", value: ibm-plex-sans }
                  - { label: "Space Grotesk (techy sans)", value: space-grotesk }
                  - { label: "Plus Jakarta Sans (friendly sans)", value: plus-jakarta-sans }
                  - { label: "DM Sans (soft sans)", value: dm-sans }
                  - { label: "Manrope (geometric sans)", value: manrope }
                  - { label: "Newsreader (elegant serif)", value: newsreader }
                  - { label: "Source Serif 4 (academic serif)", value: source-serif-4 }
                  - { label: "Fraunces (bold serif)", value: fraunces }
                  - { label: "Lora (book serif)", value: lora }
                  - { label: "IBM Plex Mono (typewriter)", value: ibm-plex-mono }
                  - { label: "JetBrains Mono (code)", value: jetbrains-mono }
              - name: hero_name
                label: Your name in the hero
                widget: select
                options:
                  - { label: "Inter (modern sans)", value: inter }
                  - { label: "IBM Plex Sans (technical sans)", value: ibm-plex-sans }
                  - { label: "Space Grotesk (techy sans)", value: space-grotesk }
                  - { label: "Plus Jakarta Sans (friendly sans)", value: plus-jakarta-sans }
                  - { label: "DM Sans (soft sans)", value: dm-sans }
                  - { label: "Manrope (geometric sans)", value: manrope }
                  - { label: "Newsreader (elegant serif)", value: newsreader }
                  - { label: "Source Serif 4 (academic serif)", value: source-serif-4 }
                  - { label: "Fraunces (bold serif)", value: fraunces }
                  - { label: "Lora (book serif)", value: lora }
                  - { label: "IBM Plex Mono (typewriter)", value: ibm-plex-mono }
                  - { label: "JetBrains Mono (code)", value: jetbrains-mono }
              - name: body
                label: Body text
                widget: select
                hint: "Paragraphs, menus, buttons."
                options:
                  - { label: "Inter (modern sans)", value: inter }
                  - { label: "IBM Plex Sans (technical sans)", value: ibm-plex-sans }
                  - { label: "Space Grotesk (techy sans)", value: space-grotesk }
                  - { label: "Plus Jakarta Sans (friendly sans)", value: plus-jakarta-sans }
                  - { label: "DM Sans (soft sans)", value: dm-sans }
                  - { label: "Manrope (geometric sans)", value: manrope }
                  - { label: "Newsreader (elegant serif)", value: newsreader }
                  - { label: "Source Serif 4 (academic serif)", value: source-serif-4 }
                  - { label: "Fraunces (bold serif)", value: fraunces }
                  - { label: "Lora (book serif)", value: lora }
                  - { label: "IBM Plex Mono (typewriter)", value: ibm-plex-mono }
                  - { label: "JetBrains Mono (code)", value: jetbrains-mono }
              - name: labels
                label: Small labels and dates
                widget: select
                hint: "Tags, dates, the line under your name, the footer."
                options:
                  - { label: "Inter (modern sans)", value: inter }
                  - { label: "IBM Plex Sans (technical sans)", value: ibm-plex-sans }
                  - { label: "Space Grotesk (techy sans)", value: space-grotesk }
                  - { label: "Plus Jakarta Sans (friendly sans)", value: plus-jakarta-sans }
                  - { label: "DM Sans (soft sans)", value: dm-sans }
                  - { label: "Manrope (geometric sans)", value: manrope }
                  - { label: "Newsreader (elegant serif)", value: newsreader }
                  - { label: "Source Serif 4 (academic serif)", value: source-serif-4 }
                  - { label: "Fraunces (bold serif)", value: fraunces }
                  - { label: "Lora (book serif)", value: lora }
                  - { label: "IBM Plex Mono (typewriter)", value: ibm-plex-mono }
                  - { label: "JetBrains Mono (code)", value: jetbrains-mono }
          - name: style
            label: Shape and style
            widget: object
            collapsed: true
            summary: "Corners {{fields.roundness}} · Headings {{fields.heading_weight}} · Cards {{fields.cards}}"
            fields:
              - name: roundness
                label: Corner roundness
                widget: select
                options:
                  - { label: "Sharp", value: sharp }
                  - { label: "Soft (original)", value: soft }
                  - { label: "Round", value: round }
              - name: heading_weight
                label: Heading boldness
                widget: select
                options:
                  - { label: "Regular", value: "400" }
                  - { label: "Medium", value: "500" }
                  - { label: "Semi-bold (original)", value: "600" }
                  - { label: "Bold", value: "700" }
              - name: cards
                label: Card style
                widget: select
                options:
                  - { label: "Filled (original)", value: filled }
                  - { label: "Outlined: page colour with a border", value: outlined }

  # ------------------------------------------------------- profile and pages
  - name: settings
    icon: person
    label: Profile & pages
    editor: { preview: false }
    files:
      - name: profile
        label: Profile
        file: src/content/site/profile.yml
        fields:
          - { name: name, label: Name, widget: string }
          - { name: role, label: Role line, widget: string, hint: "Shown under your name on the home page, e.g. Researcher in Artificial Intelligence." }
          - { name: card_role, label: "About card: role line", widget: string, required: false, hint: "Short line under your name on the About card, e.g. Researcher · AI engineer. Falls back to the role line." }
          - { name: affiliation, label: Affiliation, widget: string, required: false, hint: "University or organisation, shown above your name." }
          - { name: bio, label: Bio, widget: text, hint: "Wrap words in **double asterisks** to make them bold." }
          - { name: photo, label: Photo, widget: image, required: false, hint: "Square works best; shown small on the About card on the home page." }
          - { name: research_area, label: "About card: Research area", widget: string, required: false, hint: "Leave empty to hide this row." }
          - { name: methods, label: "About card: Methods", widget: string, required: false }
          - { name: location, label: "About card: Location", widget: string, required: false, hint: "e.g. Currently in Chengdu, China" }
          - name: links
            label: Links
            widget: object
            hint: "Leave a link empty to hide it."
            fields:
              - { name: email, label: Email, widget: string, hint: "Shown as text; also receives 'Request full paper' emails." }
              - { name: cv, label: CV page, widget: string, required: false, default: /cv/ }
              - { name: scholar, label: Google Scholar, widget: string, required: false }
              - { name: orcid, label: ORCID, widget: string, required: false }
              - { name: github, label: GitHub, widget: string, required: false }
              - { name: linkedin, label: LinkedIn, widget: string, required: false }
              - { name: upwork, label: Upwork profile, widget: string, required: false }
      - name: cv
        label: CV page
        file: src/content/pages/cv.md
        fields:
          - { name: title, label: Page title, widget: string }
          - { name: description, label: Search description, widget: text }
          - { name: pdf, label: CV PDF, widget: file, required: false, media_folder: /public/cv, public_folder: /cv }
          - { name: body, label: CV text, widget: markdown, hint: "Education, experience and skills. Publications and projects are added automatically." }
      - name: upwork_page
        label: Upwork page
        file: src/content/pages/upwork.md
        fields:
          - { name: title, label: Page title, widget: string }
          - { name: description, label: Search description, widget: text }
          - { name: body, label: Intro text, widget: markdown }
